# Cloudflare Worker: Markdown content negotiation for pickleballchiro.co (see worker.js).
# Deploy from this folder:  npx wrangler@4 login   (once)   then   npx wrangler@4 deploy
name = "pickleballchiro-agents"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "pickleballchiro.co/*", zone_name = "pickleballchiro.co" }
]
